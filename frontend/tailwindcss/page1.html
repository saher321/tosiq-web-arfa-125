<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- fontawesome-6.7.2 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.css" integrity="sha512-GmZYQ9SKTnOea030Tbiat0Y+jhnYLIpsGAe6QTnToi8hI2nNbVMETHeK4wm4MuYMQdrc38x+sX77+kVD01eNsQ==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

    <h2 class="p-5 text-green-700 bg-black border-t border-b border-green-700">
        Tailwindcss: Installation guide
    </h2>    

    <div class="p-[30px] mx-auto max-w-4xl bg-[#F1F7FC]">
        <p>
            content in this box
        </p>

        <button class="mb-5 cursor-pointer hover:shadow-lg hover:shadow-red-400 bg-sky-600 rounded-lg py-2 px-5 font-bold text-white">Button</button>
        <div class="max-w-[340px] bg-white border border-gray-300 shadow rounded-xl p-5">
            <div class="flex items-center justify-between">
                <div><i class="fa-regular fa-folder-closed"></i></div>
                <div class="font-bold text-[11px] py-[2px] px-2 rounded-full bg-green-200 text-green-700">Active</div>
            </div>
            <div>
                <h2 class="my-3 font-bold text-xl">Fintech mobile app design</h2>
                <p class="text-[14px] text-gray-600">Improve onboarding conversion and make ui clean</p>
                <div class="mt-3 text-[12px] text-gray-600">
                    <i class="fa-regular fa-flag"></i>
                    <span>Nov 2, 2027</span>
                </div>
            </div>
            <div class="my-3 bg-gray-200 h-[2px] w-full"></div>
            <div class="flex items-center justify-between">
                <div class="text-[12px] text-gray-600">
                    <i class="fa-solid fa-list-check"></i>
                    <span>18/30 tasks</span>
                </div>
                <div class="text-[20px] text-gray-600">
                    <i class="fa-solid fa-circle-user"></i>
                </div>
            </div>
        </div>
    </div>


    <!-- js -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</body>
</html>
