<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./gridsystem.css">
</head>
<body>
    
    <h2 class="bg-blue-300 m-5 p-3 rounded">
        Grid system in tailwindcss
    </h2>
    <hr>

    <div class="m-3">
        <div class="grid grid-cols-12 gap-3">
            
            <div class="col-span-8">
                <div class="nested grid grid-cols-12 gap-1">
                    <div class="col-span-4"> col 4</div>
                    <div class="col-span-4"> col 4 </div>
                    <div class="col-span-4"> col 4</div>

                    <div class="col-span-8">col 8</div>
                    <div class="col-span-4">col 4</div>
                    <div class="col-span-12">col 12</div>

                </div>
            </div>
            <div class="col-span-4">col 4</div>

            <div class="col-span-3">col 3</div>
            <div class="col-span-3">col 3</div>
            <div class="col-span-3">col 3</div>
            <div class="col-span-3">col 3</div>

            <div class="col-span-5">
                col 5
            </div>

            <div class="col-span-3">col 3</div>
            <div class="col-span-4"> col 4</div>

            <div class="col-span-6">col 6</div>
            <div class="col-span-6">col 6</div>


        </div>
    </div>
    
    <!-- js -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</body>
</html>
