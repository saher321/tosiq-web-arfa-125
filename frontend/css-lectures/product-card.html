<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./product-card.css">

    <!-- fontawesome-6.7.2 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.css" integrity="sha512-GmZYQ9SKTnOea030Tbiat0Y+jhnYLIpsGAe6QTnToi8hI2nNbVMETHeK4wm4MuYMQdrc38x+sX77+kVD01eNsQ==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>

    <div class="card">
        <div class="card-header">
            <div class="sale">Trending</div>
            <div class="fvrt">
                <i class="fa-solid fa-heart"></i>
            </div>
        </div>
        <div class="card-body">
            <span>Nike Running Shoes</span>
            <p>
                Lightweight, durable, and built for 
                peak performance every step of the way.
            </p>
        </div>
        <div class="card-footer">
            <div class="price">$59.99</div>
            <div>
                <button>
                    <i class="fa-solid fa-cart-shopping"></i> 
                    <span>Add to cart</span>
                </button>
            </div>
        </div>
    </div>

</body>
</html>
